_target_: flash_chord.configuration.make_fixed_curriculum

# Fine-tuning continuation: no VOC, object keypoint tracking (position + orientation) upweighted 20 -> 30, hand keypoint /
# joint / contact / force-closure rewards off. Termination penalty and the small action / contact-force regularisers are kept.
thresholds: [96776192]

stages:
  - _target_: flash_chord.configuration.make_curriculum_stage
    voc_scale: 0.0
    objective_weights:
      object_keypoints: 30.0
      hand_keypoints: 0.0
      hand_joint_pos: 0.0
      contact_wrench_support: 0.0
      missed_contact: 0.0
      unintended_contact: 0.0
      termination: -100.0
      action_rate_l2: ${objective.action_rate_l2.weight}
      action_l2: ${objective.action_l2.weight}
      contact_force_l2: ${objective.contact_force_l2.weight}
      force_closure: 0.0
    reset_to_first_frame_probability: 0.5
